name: Check the AI key

# Sends Google's Gemini API one tiny request with the GEMINI_API_KEY secret and
# reports what Google says (never the key itself). Runs when
# .github/check-ai-trigger changes on move-off-lovable, or by hand.

on:
  push:
    branches: [move-off-lovable]
    paths: [".github/check-ai-trigger"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Gemini to say OK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          k="$(printf '%s' "$GEMINI_API_KEY" | tr -d '[:space:]')"
          echo "::notice title=Key shape::${#k} characters, starts with '${k:0:4}'"
          for m in gemini-flash-latest gemini-2.5-flash; do
            code=$(curl -sS -o out.json -w '%{http_code}' \
              "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent" \
              -H "x-goog-api-key: $k" -H 'Content-Type: application/json' \
              -d '{"contents":[{"role":"user","parts":[{"text":"Reply with just OK"}]}]}')
            msg=$(jq -r '(.error | if . then "\(.status // "") \(.message // "") \(.details // [] | map(.reason // empty) | join(","))" else empty end) // (.candidates[0].content.parts[0].text // "no text")' out.json | tr '\n' ' ' | head -c 400)
            echo "::notice title=$m::HTTP $code — $msg"
          done
