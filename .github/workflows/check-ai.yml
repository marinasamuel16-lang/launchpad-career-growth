name: Check the AI key

# Sends Google's Gemini API one tiny request with the GEMINI_API_KEY secret and
# reports what Google says (never the key itself). Runs when
# .github/check-ai-trigger changes on move-off-lovable, or by hand.

on:
  push:
    branches: [move-off-lovable]
    paths: [".github/check-ai-trigger"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Gemini to say OK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          k="$(printf '%s' "$GEMINI_API_KEY" | tr -d '[:space:]')"
          echo "::notice title=Key shape::${#k} characters, starts with '${k:0:4}'"
          ask() {  # $1 = label, $2 = JSON body
            code=$(curl -sS -o out.json -w '%{http_code}' \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent" \
              -H "x-goog-api-key: $k" -H 'Content-Type: application/json' -d "$2")
            msg=$(jq -r '(.error | if . then "\(.status // "") \(.message // "")" else empty end) // ((.candidates[0].content.parts // []) | map(.text // "") | join("") | .[0:120])' out.json | tr '\n' ' ' | head -c 400)
            echo "::notice title=$1::HTTP $code — $msg"
          }
          curl -sS "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" -H "x-goog-api-key: $k" \
            | jq -r '[.models[] | select(.supportedGenerationMethods | index("generateContent")) | .name | sub("models/"; "") | select(test("flash"))] | join(", ")' > models.txt
          echo "::notice title=Flash models this key can use::$(cat models.txt | head -c 900)"
          for m in gemini-flash-latest gemini-flash-lite-latest $(tr ',' '\n' < models.txt | tr -d ' ' | grep -E '^gemini-[0-9.]+-flash(-lite)?$' | sort -Vr | head -4); do
            code=$(curl -sS -o out.json -w '%{http_code}' \
              "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent" \
              -H "x-goog-api-key: $k" -H 'Content-Type: application/json' \
              -d '{"contents":[{"role":"user","parts":[{"text":"Reply with just OK"}]}]}')
            msg=$(jq -r '(.error | if . then "\(.status // "") \(.message // "" | .[0:120])" else empty end) // ((.candidates[0].content.parts // []) | map(.text // "") | join("") | .[0:40])' out.json | tr '\n' ' ')
            echo "::notice title=try $m::HTTP $code — $msg"
          done
