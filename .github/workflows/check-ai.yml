name: Check the AI key

# Sends Google's Gemini API a realistic coach request with the GEMINI_API_KEY
# secret and reports, for each model, what Google answered and how long it took
# (never the key itself). Runs when .github/check-ai-trigger changes on
# move-off-lovable, or by hand.

on:
  push:
    branches: [move-off-lovable]
    paths: [".github/check-ai-trigger"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Time a coach-style request on each model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          k="$(printf '%s' "$GEMINI_API_KEY" | tr -d '[:space:]')"
          sys='You are a practical career coach for Alex, an early-career quality associate in pharma who wants to become a manager. Answer the question that was actually asked, directly, in 3-6 sentences. Use markdown when helpful.'
          body() {  # $1 = thinking level ("" = model default)
            jq -n --arg sys "$sys" --arg lvl "$1" '{
              systemInstruction: {parts: [{text: $sys}]},
              contents: [
                {role: "user", parts: [{text: "Hi"}]},
                {role: "model", parts: [{text: "Hi Alex! What would you like to work on today?"}]},
                {role: "user", parts: [{text: "How do I get more visibility at work without sounding like I am bragging?"}]}
              ]
            } + (if $lvl == "" then {} else {generationConfig: {thinkingConfig: {thinkingLevel: $lvl}}} end)'
          }
          for round in 1 2 3; do
            for m in gemini-flash-latest gemini-3.7-flash gemini-3.6-flash gemini-3.5-flash gemini-3.5-flash-lite gemini-flash-lite-latest gemini-2.5-flash; do
              for lvl in "" low; do
                case "$m" in gemini-2.5*) [ -n "$lvl" ] && continue;; esac
                body "$lvl" > req.json
                res=$(curl -sS -o out.json -w '%{http_code} %{time_total}' --max-time 40 \
                  "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent" \
                  -H "x-goog-api-key: $k" -H 'Content-Type: application/json' -d @req.json || echo "timeout 40")
                msg=$(jq -r '(.error | if . then "\(.status // "") \(.message // "" | .[0:100])" else empty end) // ((.candidates[0].content.parts // []) | map(.text // "") | join("") | "\(length) chars: \(.[0:70])")' out.json 2>/dev/null | tr '\n' ' ')
                echo "RESULT r$round $m thinking=${lvl:-default} :: HTTP $res s — $msg"
              done
            done
          done
